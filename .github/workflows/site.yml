name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"   # daily, after the arXiv announcement at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Check arXiv for new LRD papers
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/arxiv_monitor.py --days 7 --open-issues

      - name: Commit the updated inbox
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/arxiv_inbox.json
          git diff --cached --quiet || (git commit -m "arXiv inbox: $(date -u +%F)" && git push)

      - name: Validate papers
        run: python scripts/validate.py

      - name: Build catalogue
        run: python scripts/build_catalog.py

      - name: Commit new Zoo names
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/zoo_ids.json
          git diff --cached --quiet || (git commit -m "Register new Zoo names" && git push)

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp -r data/build _site/data/
          cp data/arxiv_inbox.json _site/data/ || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
