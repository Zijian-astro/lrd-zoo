notes: "NIRCam/WFSS (F322W2+F444W) broad-line emitters in the central 100 arcmin^2 of NEXUS (North Ecliptic Pole), first-epoch data. '*' = tentative classification (3 BLAGN* lack H-alpha coverage; broad_line left empty). NX26913 is a luminous quasar. Same field as Pan+26 (pan2026); 11 objects match within 0.03 arcsec. CAVEAT: NX15499 is listed at z=4.513 (broad H-alpha) but Pan+26 (NEXUS-93986) and de Graaff+26 (nexus 10687) give PRISM z=2.346/2.341 at the same position, i.e. the grism line is probably HeI 10830; value kept as published."
