source_note: >-
  arXiv LaTeX source (v3, accepted version); Table 'Physical Properties of Our Faint Type-1 AGNs' (tab_N23):
  10 objects in the final broad-line AGN sample (broad_line=1) plus 2 'other possible candidates with SNR_broad<5'
  (broad_line empty, flagged in notes). Sexagesimal J2000 positions converted with astropy SkyCoord. Not on VizieR.
  Converted with ingest.py.
notes: >-
  Spectra are NIRSpec medium/high-resolution gratings and (CEERS) PRISM from the Nakajima+2023 compilation; the table
  does not say which spectrum each broad line was measured in, so spec is the generic 'NIRSpec'. The paper does not
  use the LRD label, so lrd is empty for every row (no object counts as an LRD from this paper). GLASS objects are in
  the Abell 2744 field. Published positions are rounded to 0.01 s in RA and 0.1 arcsec in Dec. CEERS_00746 and
  CEERS_02782 are CEERS 3210 and CEERS 1670 of Kocevski+2023.
