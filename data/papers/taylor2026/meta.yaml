notes: >-
  Systematic search for broad Hbeta in 21,770 NIRSpec PRISM spectra at 7<z<9.5 (four blank fields, six lensing
  clusters); 13 of the 20 are new. Field names as in the paper (CEERS = EGS, MJ1149 = MACS J1149). G395M grating
  spectra exist for 13 objects but are used only for outflow tests. J021718.46-051326.2 is superposed with a blue
  lower-redshift interloper. Values are magnification-corrected in the paper; positions are not affected.
