source_note: >-
  arXiv LaTeX source (v4, accepted version); Table 'Measured quantities for the broad lines ... that require only one
  broad component' (tab:measures, 9 rows) plus Table 'Measured quantities for the three cases requiring two broad
  components' (tab:measures_dual, 3 rows). RA/Dec are the decimal degrees embedded in the 'JADES Name' column
  (5 decimals, written as published). Not on VizieR. Converted with ingest.py.
notes: >-
  The 12 new broad-line AGN at 4<z<7. GN-z11 (z=10.6), which the paper also discusses and lists in its inferred-
  properties table, is not included because this paper gives no coordinates for it (per the table note, its parameters
  come from earlier JADES papers). Broad Halpha detected in NIRSpec medium-resolution (R~1000) grating spectra; 3608 and 62309 are flagged
  'tentative' (DeltaBIC<10). The paper does not use the LRD label, so lrd is empty for every row. The NIRSpec ID used
  in the paper's text is given in notes.
