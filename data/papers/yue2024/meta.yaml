  Converted with ingest.py.
notes: >-
  CAVEAT: for six Kocevski+24 CEERS objects (CEERS-7902, -10444, -13135, -13318, -14949, -20777) the
  printed positions do not match their IDs: each position is that of another object in the same set
  (e.g. the row 'CEERS-7902, z=6.986' sits at the position of Kocevski+24 CEERS 13135, z=4.95),
  verified against the Kocevski+24 positions in the Zhang+25 compilation, kocevski2025 and the RUBIES
  spec-z in hviding2025. Values are kept as printed and the affected rows carry a WARNING in notes.
  Broad Halpha lines and redshifts come from the cited discovery papers (broad_line left empty).
