notes: "Photometrically selected LRDs (inclusive colour selection) with public DJA NIRSpec/PRISM spectra in six fields; 157 LRDs have PRISM spectra, the 118 with continuum S/N>2 are tabulated. IDs are DJA '<root>-<MSA id>'. CAVEAT: for a few strong-break LRDs the tabulated zspec differs from other papers (RUBIES-UDS-154183 'The Cliff' 3.6048 vs 3.548 in de Graaff+25/26; MoM-BH*-1 (mom-uds01 150135) 7.9132 vs 7.7569 in Naidu+25; A2744-45924 4.5195 vs 4.47 in Labbe+24). Values kept as published. Submitted to ApJ."
