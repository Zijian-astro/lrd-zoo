notes: >-
  All redshifts are photometric (the paper predates its UNCOVER NIRSpec follow-up). Lensing field: positions
  are image-plane; mu is the magnification from the table.
  The table footnote says three rows are images of the triply-lensed source of Furtak et al. (2023), but the
  arXiv table does not mark which rows; the duplicates are kept as published and not flagged
  (inferred from the table values only: UNCOVER-8296, -9992 and -10712, all z_phot 6.77-6.80 with mu 4-9).
  The text quotes a Parent sample of 40, but the table lists 35 rows; the Main (26) and SED (17) counts match.
  Published (ApJ 2025) version could not be checked against this arXiv v1 table (journal site not machine-accessible);
  the published abstract quotes the same 26 sources.
