# Corrections to clear errors in published tables.
#
# objects.csv files stay exactly as published; build_catalog.py applies these fixes on top and
# the web page marks each corrected entry with the reason. Only add a fix when independent
# sources agree on the right value, and say which source the new value comes from.
# Allowed keys besides paper/id/reason: ra, dec, z, z_type (use null to blank a value).

# Yue et al. 2024, Table 1: six Kocevski+24 CEERS objects are printed with each other's positions
# (ID and redshift are right, position belongs to another row). Positions from kocevski2025, same ID.
- {paper: yue2024, id: CEERS-7902, ra: 214.983037, dec: 52.956006,
   reason: "Yue+24 Table 1 prints the position of CEERS 13135 for this ID; position from Kocevski+25 (CEERS 7902)"}
- {paper: yue2024, id: CEERS-10444, ra: 214.892248, dec: 52.877406,
   reason: "Yue+24 Table 1 prints the position of CEERS 13318 for this ID; position from Kocevski+25 (CEERS 10444)"}
- {paper: yue2024, id: CEERS-13135, ra: 214.886801, dec: 52.855376,
   reason: "Yue+24 Table 1 prints the position of CEERS 14949 for this ID; position from Kocevski+25 (CEERS 13135)"}
- {paper: yue2024, id: CEERS-13318, ra: 214.795367, dec: 52.788848,
   reason: "Yue+24 Table 1 prints the position of CEERS 7902 for this ID; position from Kocevski+25 (CEERS 13318)"}
- {paper: yue2024, id: CEERS-14949, ra: 214.990983, dec: 52.916523,
   reason: "Yue+24 Table 1 prints the position of CEERS 20777 for this ID; position from Kocevski+25 (CEERS 14949)"}
- {paper: yue2024, id: CEERS-20777, ra: 215.137064, dec: 52.988557,
   reason: "Yue+24 Table 1 prints the position of CEERS 10444 for this ID; position from Kocevski+25 (CEERS 20777)"}

